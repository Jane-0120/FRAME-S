<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRAME(S) — Graduation Exhibition 2026</title>
  <meta name="description" content="FRAME(S) — Graduation Exhibition 2026">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FRAME(S) — Graduation Exhibition 2026">
  <meta property="og:description" content="FRAME(S) — Graduation Exhibition 2026">
  <meta property="og:url" content="https://jane-0120.github.io/FRAMERS/">
  <meta property="og:image" content="https://jane-0120.github.io/FRAMERS/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jane-0120.github.io/FRAMERS/assets/og-image.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-home">

<div class="cursor" id="cursor" aria-hidden="true"><span class="cursor-label" id="cursorLabel">View</span></div>

<header class="topbar">
  <a class="pill brand" href="#/" id="brand" aria-label="FRAME(S) 2026"><span class="logo" data-logo></span></a>
  <button class="pill ghost home-only" type="button" id="aboutBtn">About</button>
  <span class="topbar-spacer"></span>
  <div class="detail-nav">
    <a class="pill" href="#/" id="dClose">All Works ✕</a>
  </div>
  <button class="pill about-close" id="aboutClose" type="button">Close ✕</button>
  <button class="pill theme" id="themeBtn" type="button" aria-label="Toggle dark mode"><svg class="moon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7Z"/></svg></button>
</header>

<!-- ───────── HOME ───────── -->
<main class="home" id="home" data-layout="stack">
  <div class="bg-layer" aria-hidden="true"><img id="bgA" alt=""><img id="bgB" alt=""></div>
  <div class="guides" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="stage" id="stage"><div class="world" id="world"></div></div>
  <div class="frame-ui" aria-hidden="true"></div>
  <button class="side-nav prev" id="prevBtn" type="button">◂ Prev</button>
  <button class="side-nav next" id="nextBtn" type="button">Next ▸</button>
  <ol class="index-list" id="indexList"></ol>
  <div class="bigtitle" id="bigTitle"></div>
  <div class="caption" id="caption"></div>
  <nav class="layouts" id="layouts" aria-label="Layout"></nav>
  <div class="ruler"><div class="ruler-marks" id="rulerMarks"><span class="ruler-dot" id="rulerDot"></span></div></div>
</main>

<!-- ───────── DETAIL ───────── -->
<article class="detail" id="detail" hidden>
  <section class="hero" id="hero">
    <div class="player" id="player">
      <video id="video" playsinline preload="metadata" loop></video>
      <div class="player-shade"></div>
      <div class="video-error">Video unavailable — js/data.js 의 video 경로를 확인하세요</div>
      <div class="hero-info">
        <h1 class="d-title" id="dTitle"></h1>
        <p class="d-name" id="dName"></p>
        <div class="actions">
          <button class="btn primary" id="playBtn" type="button"></button>
          <button class="btn icon" id="fsBtn" type="button" aria-label="Fullscreen">⤢</button>
        </div>
      </div>
      <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
      <button class="pip-close" id="pipClose" type="button" aria-label="Close mini player">✕</button>
    </div>
  </section>

  <section class="catalog" id="catalog">
    <div class="cat-body">
      <aside class="cat-aside">
        <div class="cat-num" id="catNum"></div>
        <p class="cat-desc" id="catDesc"></p>
        <a class="cat-link" id="catLink" href="#" target="_blank" rel="noopener" hidden>Link<span aria-hidden="true">↗</span></a>
        <dl class="cat-dl" id="catDl"></dl>
        <div class="cat-progress" id="catProgress" aria-hidden="true"><span id="catProgressBar"></span></div>
      </aside>
      <div class="cat-pages" id="catPages"></div>
    </div>
  </section>

  <section class="more">
    <p class="eyebrow more-head">More Works</p>
    <div class="more-row" id="moreRow"></div>
  </section>

  <a class="next-work" id="nextLink" href="#/"></a>
  <footer class="foot"><a href="#/">↑ All Works</a><span id="footInfo"></span></footer>
</article>

<!-- ───────── ABOUT ───────── -->
<div class="about" id="about" aria-hidden="true">
  <div class="about-inner" id="aboutInner"></div>
</div>

<script src="js/data.js"></script>
<script src="js/placeholder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
